<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Operador - Bermuda Racing</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px; background: #07111f; color: #f4f7fb; font-family: system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; max-width: 1100px; margin: 0 auto 24px; }
    h1, h2 { margin: 0; }
    #connection { padding: 8px 14px; border-radius: 999px; background: #5a2630; font-weight: 800; }
    #connection.online { background: #155c3b; }
    main { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; max-width: 1100px; margin: auto; }
    section { padding: 22px; border: 1px solid #29425f; border-radius: 18px; background: #0d1d30; box-shadow: 0 14px 38px #0005; }
    #race-state { margin: 16px 0; color: #ffd21f; font-size: clamp(30px, 5vw, 58px); font-weight: 1000; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    button { min-height: 52px; padding: 10px 14px; border: 0; border-radius: 12px; background: #1687ff; color: white; font-size: 16px; font-weight: 900; cursor: pointer; }
    button.danger { background: #d83b3b; }
    button.secondary { background: #425873; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    #players { display: grid; gap: 10px; margin: 16px 0 24px; }
    .player { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; padding: 12px; border: 1px solid #29425f; border-radius: 12px; background: #14253b; }
    .player-number { font-size: 22px; font-weight: 1000; }
    .player small { display: block; color: #9eb0c5; }
    .player button { min-height: 38px; background: #a92f38; font-size: 13px; }
    form { display: grid; gap: 14px; margin-top: 18px; }
    label { display: grid; grid-template-columns: 1fr 100px; align-items: center; gap: 12px; font-weight: 700; }
    input { width: 100%; height: 44px; padding: 0 10px; border: 1px solid #55708f; border-radius: 9px; background: #07111f; color: white; font-size: 18px; }
    #message { min-height: 24px; margin-top: 14px; color: #ffd21f; font-weight: 700; }
    #leaderboard { display: grid; gap: 8px; margin-top: 16px; }
    .leaderboard-entry { padding: 10px 12px; border-radius: 10px; background: #14253b; font-weight: 800; }
    @media (max-width: 760px) { body { padding: 16px; } main { grid-template-columns: 1fr; } .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><h1>BERMUDA RACING</h1><div id="connection">DESCONECTADO</div></header>
  <main>
    <section>
      <h2>Control de carrera</h2>
      <div id="race-state">LOBBY</div>
      <div class="actions">
        <button id="start" type="button">INICIAR</button>
        <button id="stop" class="danger" type="button">DETENER</button>
        <button id="reset" class="secondary" type="button">REINICIAR</button>
      </div>
      <div id="message"></div>
      <h2>Jugadores</h2>
      <div id="players"></div>
      <h2>Mejores tiempos</h2>
      <div id="leaderboard"></div>
    </section>
    <section>
      <h2>Configuracion</h2>
      <form id="config">
        <label>Vueltas <input id="total-laps" type="number" min="1" max="20"></label>
        <label>Countdown <input id="countdown" type="number" min="1" max="30"></label>
        <label>Timeout final <input id="finish-timeout" type="number" min="3" max="120"></label>
        <label>Duracion resultados <input id="results-duration" type="number" min="3" max="120"></label>
        <button type="submit">GUARDAR CONFIGURACION</button>
      </form>
    </section>
  </main>
  <script>
    const connection = document.querySelector('#connection');
    const raceState = document.querySelector('#race-state');
    const players = document.querySelector('#players');
    const message = document.querySelector('#message');
    const startButton = document.querySelector('#start');
    const stopButton = document.querySelector('#stop');
    const resetButton = document.querySelector('#reset');
    const configForm = document.querySelector('#config');
    const leaderboard = document.querySelector('#leaderboard');
    let socket;

    function send(command, extra = {}) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: 'operatorCommand', command, ...extra }));
    }

    function render(state) {
      raceState.textContent = state.state.toUpperCase();
      startButton.disabled = state.state !== 'lobby';
      stopButton.disabled = state.state === 'lobby';
      const configLocked = state.state !== 'lobby';
      configForm.querySelectorAll('input, button').forEach(element => element.disabled = configLocked);
      document.querySelector('#total-laps').value = state.config.totalLaps;
      document.querySelector('#countdown').value = state.config.countdownSeconds;
      document.querySelector('#finish-timeout').value = state.config.finishTimeoutSeconds;
      document.querySelector('#results-duration').value = state.config.resultsDurationSeconds;
      players.replaceChildren();
      if (state.players.length === 0) players.textContent = 'No hay jugadores conectados.';
      for (const player of state.players) {
        const card = document.createElement('div');
        card.className = 'player';
        const number = document.createElement('div');
        number.className = 'player-number';
        number.textContent = `P${player.player}`;
        const detail = document.createElement('div');
        const name = document.createElement('strong');
        name.textContent = player.name;
        const status = document.createElement('small');
        status.textContent = `${player.connected ? 'CONECTADO' : 'RECONECTANDO'} - ${player.ready ? 'LISTO' : 'NO LISTO'}`;
        detail.append(name, status);
        const kick = document.createElement('button');
        kick.type = 'button';
        kick.textContent = 'EXPULSAR';
        kick.addEventListener('click', () => send('kick', { player: player.player }));
        card.append(number, detail, kick);
        players.append(card);
      }
      leaderboard.replaceChildren();
      if (!state.leaderboard?.length) leaderboard.textContent = 'Aun no hay tiempos registrados.';
      for (const [index, entry] of (state.leaderboard || []).entries()) {
        const row = document.createElement('div');
        row.className = 'leaderboard-entry';
        const time = `${Math.floor(entry.totalTime / 60)}:${(entry.totalTime % 60).toFixed(2).padStart(5, '0')}`;
        row.textContent = `${index + 1}. ${entry.name} - ${time}`;
        leaderboard.append(row);
      }
    }

    function connect() {
      socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}?role=operator`);
      socket.addEventListener('open', () => { connection.textContent = 'CONECTADO'; connection.classList.add('online'); });
      socket.addEventListener('message', event => {
        const data = JSON.parse(event.data);
        if (data.type === 'operatorState') render(data);
        if (data.type === 'waiting') message.textContent = `Falta LISTO: ${data.missingPlayers.map(player => `P${player}`).join(', ')}`;
      });
      socket.addEventListener('close', () => {
        connection.textContent = 'RECONECTANDO';
        connection.classList.remove('online');
        setTimeout(connect, 1000);
      });
    }

    startButton.addEventListener('click', () => { message.textContent = ''; send('start'); });
    stopButton.addEventListener('click', () => send('stop'));
    resetButton.addEventListener('click', () => send('reset'));
    configForm.addEventListener('submit', event => {
      event.preventDefault();
      send('config', { config: {
        totalLaps: Number(document.querySelector('#total-laps').value),
        countdownSeconds: Number(document.querySelector('#countdown').value),
        finishTimeoutSeconds: Number(document.querySelector('#finish-timeout').value),
        resultsDurationSeconds: Number(document.querySelector('#results-duration').value)
      } });
      message.textContent = 'Configuracion guardada.';
    });
    connect();
  </script>
</body>
</html>
