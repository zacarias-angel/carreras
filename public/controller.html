<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bermuda Racing">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/app-icon.png">
  <link rel="preload" href="/engine.mp3" as="audio" type="audio/mpeg">
  <title>Control de carrera</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { --player-color: #1687ff; background: #07111f; color: white; font-family: system-ui, sans-serif; box-shadow: inset 0 0 0 7px var(--player-color); }
    body::after { content: ''; position: fixed; inset: 0; z-index: 20; pointer-events: none; background: transparent; }
    body.hit::after { animation: collision-flash .55s ease-out; }
    body.announce #announcement { animation: announcement-pop 2.8s ease both; }
    @keyframes collision-flash { 0%, 35% { background: #fff; } 70% { background: #ff2626aa; } 100% { background: transparent; } }
    @keyframes announcement-pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.65); } 12%, 72% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.12); } }
    body.waiting #controls { opacity: .28; pointer-events: none; }
    #status { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; z-index: 3; transform: translateX(-50%); padding: 7px 14px; border: 2px solid var(--player-color); border-radius: 999px; background: #14253b; font-size: 13px; font-weight: 800; letter-spacing: .08em; white-space: nowrap; }
    #race-hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); z-index: 3; display: flex; gap: 8px; }
    .hud-value { min-width: 92px; padding: 7px 10px; border: 2px solid var(--player-color); border-radius: 12px; background: #14253be8; text-align: center; font-size: 16px; font-weight: 900; white-space: nowrap; }
    #ready { position: fixed; left: 50%; top: 50%; z-index: 4; width: min(72vw, 360px); height: min(28vh, 150px); transform: translate(-50%, -50%); border-color: var(--player-color); background: var(--player-color); font-size: clamp(28px, 9vw, 56px); }
    #ready:disabled { opacity: .75; }
    #name-entry, #result { position: fixed; left: 50%; top: 50%; z-index: 5; width: min(88vw, 440px); transform: translate(-50%, -50%); padding: 22px; border: 3px solid var(--player-color); border-radius: 18px; background: #0d1d30f5; text-align: center; box-shadow: 0 12px 40px #000b; }
    #name-entry h1, #result h1 { margin: 0 0 16px; font-size: clamp(24px, 7vw, 42px); }
    #player-name { width: 100%; height: 58px; padding: 0 14px; border: 2px solid #55708f; border-radius: 12px; background: white; color: #081521; font-size: 24px; font-weight: 800; text-align: center; touch-action: auto; user-select: text; }
    #save-name { width: 100%; height: 64px; margin-top: 12px; border-color: var(--player-color); background: var(--player-color); font-size: 24px; }
    #result p { margin: 9px 0; font-size: clamp(18px, 5vw, 27px); font-weight: 800; }
    #result-title { color: var(--player-color); }
    #rotate-device { display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; padding: 28px; background: #07111f; color: white; text-align: center; font-size: clamp(28px, 9vw, 52px); font-weight: 900; line-height: 1.2; }
    #announcement { position: fixed; left: 50%; top: 50%; z-index: 10; width: min(90vw, 620px); transform: translate(-50%, -50%); padding: 24px; border: 4px solid var(--player-color); border-radius: 22px; background: #07111ff2; color: white; text-align: center; font-size: clamp(34px, 11vw, 72px); font-weight: 1000; line-height: 1; opacity: 0; pointer-events: none; text-shadow: 0 4px 18px #000; }
    #fullscreen { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 6; min-width: 132px; height: 38px; padding: 0 12px; border-radius: 999px; border-color: var(--player-color); background: #14253b; font-size: 12px; letter-spacing: .06em; }
    #install-help { position: fixed; inset: 0; z-index: 900; display: grid; place-items: center; padding: 24px; background: #07111ff5; }
    #install-help[hidden] { display: none; }
    #install-card { width: min(92vw, 520px); padding: 24px; border: 3px solid var(--player-color); border-radius: 20px; background: #0d1d30; text-align: center; box-shadow: 0 16px 50px #000c; }
    #install-card h2 { margin: 0 0 16px; font-size: clamp(25px, 7vw, 38px); }
    #install-card p { margin: 10px 0; font-size: clamp(17px, 4.5vw, 23px); font-weight: 700; line-height: 1.35; }
    #close-install { width: 100%; height: 58px; margin-top: 14px; border-color: var(--player-color); background: var(--player-color); font-size: 20px; }
    #controls { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; height: 100%; padding: max(48px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .side { display: grid; gap: 12px; }
    .steering { grid-template-columns: 1fr 1fr; }
    .pedals { grid-template-rows: 1.35fr 1fr; }
    button { border: 2px solid #385171; border-radius: 22px; background: #13263d; color: white; font-size: clamp(28px, 8vw, 68px); font-weight: 900; box-shadow: inset 0 -8px 0 rgba(0,0,0,.24); }
    button.active { transform: translateY(3px); border-color: white; background: #1664d9; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 0 30px rgba(22,100,217,.6); }
    #up.active { background: #18a957; }
    #down.active { background: #d33a34; }
    .label { display: block; margin-top: 5px; font-size: clamp(10px, 2vw, 16px); letter-spacing: .12em; }
    @media (orientation: portrait) {
      body > *:not(#rotate-device) { display: none !important; }
      #rotate-device { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-device">GIRA EL TELEFONO<br>PARA JUGAR</div>
  <div id="status">CONECTANDO</div>
  <div id="race-hud">
    <div id="position" class="hud-value">POS --/--</div>
    <div id="speed" class="hud-value">0 KM/H</div>
  </div>
  <button id="fullscreen" type="button">PANTALLA COMPLETA</button>
  <div id="announcement" aria-live="assertive"></div>
  <section id="install-help" hidden>
    <div id="install-card">
      <h2>PANTALLA COMPLETA EN iPHONE</h2>
      <p>1. Toca el boton Compartir de Safari.</p>
      <p>2. Elige Agregar a pantalla de inicio.</p>
      <p>3. Abre Bermuda Racing desde el nuevo icono.</p>
      <button id="close-install" type="button">ENTENDIDO</button>
    </div>
  </section>
  <section id="name-entry" hidden>
    <h1>INGRESA TU NOMBRE</h1>
    <input id="player-name" maxlength="16" autocomplete="nickname" placeholder="Tu nombre">
    <button id="save-name" type="button">CONTINUAR</button>
  </section>
  <button id="ready" type="button" hidden>LISTO</button>
  <section id="result" hidden>
    <h1 id="result-title"></h1>
    <p id="result-time"></p>
    <p id="result-best"></p>
    <p id="result-difference"></p>
  </section>
  <main id="controls">
    <section class="side steering">
      <button id="left" aria-label="Izquierda">◀<span class="label">IZQUIERDA</span></button>
      <button id="right" aria-label="Derecha">▶<span class="label">DERECHA</span></button>
    </section>
    <section class="side pedals">
      <button id="up" aria-label="Acelerar">▲<span class="label">ACELERAR</span></button>
      <button id="down" aria-label="Frenar">▼<span class="label">FRENAR</span></button>
    </section>
  </main>
  <script>
    const state = { left: false, right: false, up: false, down: false };
    const status = document.querySelector('#status');
    const readyButton = document.querySelector('#ready');
    const nameEntry = document.querySelector('#name-entry');
    const nameInput = document.querySelector('#player-name');
    const saveNameButton = document.querySelector('#save-name');
    const resultPanel = document.querySelector('#result');
    const resultTitle = document.querySelector('#result-title');
    const resultTime = document.querySelector('#result-time');
    const resultBest = document.querySelector('#result-best');
    const resultDifference = document.querySelector('#result-difference');
    const fullscreenButton = document.querySelector('#fullscreen');
    const installHelp = document.querySelector('#install-help');
    const closeInstallButton = document.querySelector('#close-install');
    const positionDisplay = document.querySelector('#position');
    const speedDisplay = document.querySelector('#speed');
    const playerColors = ['#e53935', '#1687ff', '#ffd21f', '#24c96b'];
    let socket;
    let player = 0;
    let isHost = false;
    let isReady = false;
    let playerName = '';
    let shouldReconnect = true;
    let audioContext;
    let engineBuffer;
    let engineLoadPromise;
    let engineSource;
    let engineRequested = false;
    let announcementTimer;
    const sessionStorageKey = 'event-racing-session';
    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isStandalone = () => navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    let deferredInstallPrompt;

    document.body.classList.add('waiting');

    async function lockLandscape() {
      if (!screen.orientation?.lock) return;
      try {
        await screen.orientation.lock('landscape');
      } catch (_error) {
        // The orientation overlay remains as the cross-browser fallback.
      }
    }

    async function enterFullscreen(showInstructions = false) {
      if (document.fullscreenElement || document.webkitFullscreenElement || isStandalone()) {
        fullscreenButton.hidden = true;
        return true;
      }

      const requestFullscreen = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
      if (requestFullscreen) {
        try {
          await requestFullscreen.call(document.documentElement, { navigationUI: 'hide' });
          await lockLandscape();
          fullscreenButton.hidden = true;
          return true;
        } catch (_error) {
          try {
            await requestFullscreen.call(document.documentElement);
            await lockLandscape();
            fullscreenButton.hidden = true;
            return true;
          } catch (_fallbackError) {
            // A visible fallback remains available when the browser rejects fullscreen.
          }
        }
      }

      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        if (choice.outcome === 'accepted') fullscreenButton.textContent = 'ABRIR APP INSTALADA';
        return choice.outcome === 'accepted';
      }

      if (showInstructions && isIos && !isStandalone()) installHelp.hidden = false;
      return false;
    }

    async function ensureAudio() {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state !== 'running') await audioContext.resume();
      await loadEngineAudio();
      return audioContext;
    }

    function loadEngineAudio() {
      if (engineBuffer) return Promise.resolve(engineBuffer);
      if (!engineLoadPromise) {
        engineLoadPromise = fetch('/engine.mp3')
          .then(response => {
            if (!response.ok) throw new Error(`Engine audio HTTP ${response.status}`);
            return response.arrayBuffer();
          })
          .then(data => audioContext.decodeAudioData(data))
          .then(buffer => {
            engineBuffer = buffer;
            return buffer;
          })
          .catch(error => {
            engineLoadPromise = null;
            console.error('No se pudo cargar el sonido del motor.', error);
            throw error;
          });
      }
      return engineLoadPromise;
    }

    function playEngineBuffer() {
      if (!engineRequested || engineSource || !engineBuffer) return;
      const source = audioContext.createBufferSource();
      const gain = audioContext.createGain();
      source.buffer = engineBuffer;
      source.loop = true;
      gain.gain.value = 1;
      source.connect(gain);
      gain.connect(audioContext.destination);
      source.onended = () => {
        if (engineSource === source) engineSource = null;
        source.disconnect();
        gain.disconnect();
      };
      engineSource = source;
      source.start();
    }

    async function startEngine() {
      engineRequested = true;
      try {
        await ensureAudio();
        playEngineBuffer();
      } catch (error) {
        console.error('No se pudo iniciar el sonido del motor.', error);
      }
    }

    function stopEngine() {
      engineRequested = false;
      if (!engineSource) return;
      const source = engineSource;
      engineSource = null;
      source.stop();
    }

    function collisionFeedback() {
      document.body.classList.remove('hit');
      void document.body.offsetWidth;
      document.body.classList.add('hit');
      setTimeout(() => document.body.classList.remove('hit'), 600);

      if (navigator.vibrate) {
        navigator.vibrate([280, 70, 280, 70, 420]);
        setTimeout(() => navigator.vibrate(320), 850);
      }
    }

    async function playSignal(frequencies) {
      try {
        await ensureAudio();
      } catch (error) {
        console.error('No se pudo iniciar la senal de audio.', error);
        return;
      }
      const now = audioContext.currentTime;
      frequencies.forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const start = now + index * .16;
        oscillator.frequency.value = frequency;
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(.18, start + .02);
        gain.gain.exponentialRampToValueAtTime(.0001, start + .14);
        oscillator.start(start);
        oscillator.stop(start + .16);
      });
    }

    function announce(text, frequencies, vibration) {
      const announcement = document.querySelector('#announcement');
      clearTimeout(announcementTimer);
      document.body.classList.remove('announce');
      void document.body.offsetWidth;
      announcement.textContent = text;
      document.body.classList.add('announce');
      if (frequencies) playSignal(frequencies);
      if (vibration && navigator.vibrate) navigator.vibrate(vibration);
      announcementTimer = setTimeout(() => document.body.classList.remove('announce'), 2900);
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds - minutes * 60;
      return `${String(minutes).padStart(2, '0')}:${remainder.toFixed(2).padStart(5, '0')}`;
    }

    function showPersonalResult(result) {
      for (const key of Object.keys(state)) state[key] = false;
      sendInput();
      const medals = ['🏆 GANASTE', '🥈 Terminaste 2°', '🥉 Terminaste 3°'];
      resultTitle.textContent = result.completed === false
        ? `Terminaste ${result.position}°`
        : (medals[result.position - 1] || `Terminaste ${result.position}°`);
      resultTime.textContent = result.completed === false
        ? `Tiempo agotado: ${formatTime(result.totalTime)}`
        : `Tiempo: ${formatTime(result.totalTime)}`;
      resultBest.textContent = result.bestLap > 0
        ? `Mejor vuelta: ${formatTime(result.bestLap)}`
        : 'Sin vueltas completas';
      resultDifference.textContent = result.completed === false
        ? 'Carrera finalizada'
        : (result.position === 1 ? '' : `Te faltaron ${result.difference.toFixed(2)} s`);
      resultPanel.hidden = false;
      document.body.classList.add('waiting');
      stopEngine();
    }

    function connect() {
      const sessionToken = localStorage.getItem(sessionStorageKey);
      const sessionQuery = sessionToken ? `&session=${encodeURIComponent(sessionToken)}` : '';
      socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}?role=controller${sessionQuery}`);
      socket.addEventListener('message', event => {
        const message = JSON.parse(event.data);
        if (message.type === 'welcome') {
          player = message.player;
          isHost = Boolean(message.host);
          isReady = Boolean(message.ready);
          playerName = message.name || '';
          if (message.sessionToken) localStorage.setItem(sessionStorageKey, message.sessionToken);
          status.textContent = `P${player} - ESPERANDO`;
          document.body.style.setProperty('--player-color', playerColors[player - 1]);
          readyButton.textContent = isHost ? 'INICIAR CARRERA' : 'LISTO';
          nameEntry.hidden = Boolean(playerName);
          readyButton.hidden = !playerName;
          if (!playerName) nameInput.focus();
        }
        if (message.type === 'nameSaved') {
          playerName = message.name;
          nameEntry.hidden = true;
          readyButton.hidden = false;
          status.textContent = `P${player} ${playerName} - ESPERANDO`;
        }
        if (message.type === 'nameError') {
          nameEntry.hidden = false;
          readyButton.hidden = true;
          nameInput.focus();
        }
        if (message.type === 'full') status.textContent = 'SALA COMPLETA';
        if (message.type === 'locked') {
          shouldReconnect = false;
          status.textContent = 'CARRERA EN CURSO';
          readyButton.hidden = true;
          document.querySelector('#controls').hidden = true;
        }
        if (message.type === 'kicked') {
          shouldReconnect = false;
          localStorage.removeItem(sessionStorageKey);
          status.textContent = 'DESCONECTADO POR OPERADOR';
          document.body.classList.add('waiting');
        }
        if (message.type === 'vibrate') collisionFeedback();
        if (message.type === 'telemetry') {
          positionDisplay.textContent = `POS ${message.position}/${message.totalPlayers}`;
          speedDisplay.textContent = `${Math.round(message.speed)} KM/H`;
        }
        if (message.type === 'respawn') announce('VOLVIENDO A PISTA...', null, [100, 50, 100]);
        if (message.type === 'lap') status.textContent = `P${player} ${playerName} - VUELTA ${message.lap}/${message.totalLaps}`;
        if (message.type === 'lastLap') announce('ULTIMA VUELTA', [520, 700, 920], [120, 60, 180]);
        if (message.type === 'winnerDeclared') {
          const ownWin = message.player === player;
          announce(ownWin ? 'GANASTE!' : `GANA ${message.name}`, ownWin ? [523, 659, 784, 1047] : [392, 523, 659], ownWin ? [180, 70, 180, 70, 420] : [140, 60, 140]);
        }
        if (message.type === 'finishCountdown' && resultPanel.hidden) status.textContent = `TIEMPO PARA TERMINAR: ${message.seconds}`;
        if (message.type === 'personalResult') showPersonalResult(message.result);
        if (message.type === 'waiting') {
          readyButton.disabled = false;
          readyButton.textContent = 'INICIAR CARRERA';
          status.textContent = `FALTA LISTO: ${message.missingPlayers.map(number => `P${number}`).join(', ')}`;
        }
        if (message.type === 'race') {
          if (message.state === 'lobby') {
            const ownState = message.players?.find(item => item.player === player);
            isReady = Boolean(ownState?.ready);
            document.body.classList.add('waiting');
            resultPanel.hidden = true;
            readyButton.hidden = !playerName;
            nameEntry.hidden = Boolean(playerName);
            readyButton.disabled = !isHost && isReady;
            readyButton.textContent = isHost ? 'INICIAR CARRERA' : (isReady ? 'PREPARADO' : 'LISTO');
            status.textContent = player ? `P${player} ${playerName} - ${isReady ? 'LISTO' : 'ESPERANDO'}` : 'CONECTANDO';
          }
          if (message.state === 'countdown') {
            readyButton.hidden = true;
            status.textContent = `P${player} - ${message.countdown}`;
          }
          if (message.state === 'racing') {
            document.body.classList.remove('waiting');
            readyButton.hidden = true;
            status.textContent = `P${player} - CARRERA`;
          }
          if (message.state === 'finished') {
            document.body.classList.add('waiting');
            stopEngine();
            status.textContent = message.winner === player ? `P${player} - GANADOR` : `GANA P${message.winner}`;
          }
        }
      });
      socket.addEventListener('close', () => {
        stopEngine();
        if (!shouldReconnect) return;
        status.textContent = 'RECONECTANDO';
        setTimeout(connect, 1000);
      });
    }

    function sendInput() {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({
        type: 'input',
        steering: Number(state.left) - Number(state.right),
        throttle: Number(state.up) - Number(state.down)
      }));
    }

    for (const id of Object.keys(state)) {
      const button = document.querySelector(`#${id}`);
      const setPressed = pressed => event => {
        event.preventDefault();
        state[id] = pressed;
        button.classList.toggle('active', pressed);
        if (id === 'up') pressed ? startEngine() : stopEngine();
        sendInput();
      };
      button.addEventListener('pointerdown', event => {
        button.setPointerCapture(event.pointerId);
        setPressed(true)(event);
      });
      button.addEventListener('pointerup', setPressed(false));
      button.addEventListener('pointercancel', setPressed(false));
    }

    const unlockAudio = () => ensureAudio().catch(() => {});
    document.addEventListener('pointerdown', unlockAudio, { capture: true });
    document.addEventListener('touchend', unlockAudio, { capture: true, passive: true });

    function enforceLandscape() {
      if (!window.matchMedia('(orientation: portrait)').matches) return;
      for (const key of Object.keys(state)) state[key] = false;
      stopEngine();
      sendInput();
    }

    window.addEventListener('orientationchange', enforceLandscape);
    window.addEventListener('resize', enforceLandscape);

    function saveName() {
      const name = nameInput.value.trim();
      if (!name || !socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: 'name', name }));
    }

    saveNameButton.addEventListener('pointerdown', event => {
      event.preventDefault();
      ensureAudio();
      enterFullscreen(false);
      saveName();
    });
    nameInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') saveName();
    });

    readyButton.addEventListener('pointerdown', event => {
      event.preventDefault();
      ensureAudio();
      enterFullscreen(false);
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: isHost ? 'start' : 'ready', ready: true }));
      readyButton.disabled = true;
      readyButton.textContent = isHost ? 'COMPROBANDO...' : 'PREPARADO';
      status.textContent = isHost ? `P${player} - INICIANDO` : `P${player} - LISTO`;
    });

    fullscreenButton.addEventListener('pointerdown', event => {
      event.preventDefault();
      enterFullscreen(true);
    });
    closeInstallButton.addEventListener('pointerdown', event => {
      event.preventDefault();
      installHelp.hidden = true;
    });
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      fullscreenButton.textContent = 'INSTALAR APP';
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      fullscreenButton.textContent = 'ABRIR APP INSTALADA';
    });
    document.addEventListener('fullscreenchange', () => {
      fullscreenButton.hidden = Boolean(document.fullscreenElement);
    });

    if (isStandalone()) fullscreenButton.hidden = true;
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(() => {});

    connect();
    setInterval(sendInput, 100);
  </script>
</body>
</html>
